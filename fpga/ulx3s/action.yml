name: 'Tiny Tapeout FPGA bitstream (gojimmypi ulx3s)'
description: 'This action will generate an ice40up5k FPGA bitstream from your Tiny Tapeout project'
branding:
  color: purple
  icon: check

inputs:
  tools-repo:
    description: 'Override tt-support-tools repository with gojimmypi'
    default: 'gojimmypi/tt-support-tools'
    required: false
    type: string
  tools-ref:
    description: 'Override tt-support-tools branch/tag/commit'
    default: 'ulx3s'
    required: false
    type: string

runs:
  using: 'composite'
  steps:
    - name: Checkout tt-support-tools repo
      uses: actions/checkout@v6
      with:
        repository: "${{ inputs.tools-repo }}"
        path: tt
        ref: "${{ inputs.tools-ref }}"

    - name: Setup python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip' # caching pip dependencies

    - name: Install tt-support-tools dependencies
      shell: bash
      run: pip install -r tt/requirements.txt

    - name: Install Python packages
      if: ${{ hashFiles('test/requirements.txt') != '' }}
      shell: bash
      run: pip install -r test/requirements.txt

    - name: Fetch verilog and build config
      shell: bash
      run: |
        python tt/tt_tool.py --create-user-config $FLOW_ARG

    - name: install oss-cad-suite
      uses: YosysHQ/setup-oss-cad-suite@v4
      with:
        python-override: true
        version: '2026-04-26'

    - name: Create the bitstreams
      shell: bash
      run: |
        echo "Create the FPGA bitstream files"

        echo "Create iCE40 UP5K bitstream (default)"
        python tt/tt_fpga.py harden \
              --name tt_um_fpga_ice40

        echo "Create ULX3S ECP5 bitstream"
        python tt/tt_fpga.py harden       \
               --name tt_um_fpga_ecp5_85k \
               --fpga-target ulx3s-ecp5   \
               --ecp5-device 85k          \
               --lpf ulx3s_v20.lpf

    - name: Upload the bitstream
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: fpga_bitstream
        path: |
          build/*
          docs/*
          src/*
          info.yaml
          LICENSE
